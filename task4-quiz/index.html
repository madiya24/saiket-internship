<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Dev Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="quiz">
    <h1>Web Dev Quiz</h1>

    <section id="quiz-box">
      <div class="top-row">
        <p id="progress" class="progress"></p>
        <p id="live-score" class="live-score"></p>
      </div>
      <div class="bar"><div id="bar-fill" class="bar-fill"></div></div>

      <h2 id="question"></h2>
      <div id="options" class="options"></div>
      <p id="message" class="message"></p>
      <button id="next-btn" class="btn" type="button">Next</button>
    </section>

    <section id="result-box" class="hidden">
      <h2 id="result-title"></h2>
      <p id="score" class="score"></p>
      <p id="result-text" class="result-text"></p>
      <button id="restart-btn" class="btn accent" type="button">Try Again</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
