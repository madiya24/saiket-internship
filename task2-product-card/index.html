<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <article class="card">
        <img class="card-image" src="../assets/download.webp" alt="Nike sneaker">
        <div class="card-body">
            <h2 class="card-title">Nilke sneaker</h2>
            <p class="card-price">R2500</p>
            <button class="card-button" type="button">Add to Cart</button>
        </div>
    </article>
</body>
</html>
